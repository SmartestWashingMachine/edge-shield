<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Shield only, no tile. The check is knocked straight through the solid
       silhouette (evenodd) rather than stroked on top, so it survives at 16px
       and reads correctly whatever colour the tab bar behind it happens to be.
       The fill is a cool mid-grey from the site's zinc ramp — light enough to
       hold up on a dark tab bar, dark enough to stay visible on a white one,
       which a pure-white or pure-black mark would not manage. -->
  <path
    fill="#a8acb5"
    fill-rule="evenodd"
    d="M16 2.2 28.6 6.6v10.1c0 7.6-5.3 12.2-12.6 14.6C8.7 28.9 3.4 24.3 3.4 16.7V6.6Zm-5.4 14.1L15 21l7.6-9.6-2.6-2.1-5.1 6.4-2.3-2.4Z"
  />
</svg>
